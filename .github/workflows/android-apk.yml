name: Android APK (arm64-v8a)

on:
  push:
    branches:
      - android/phase1-termux-bootstrap
      - android/runtime-integration
      - android/on-device-auto-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compile installable APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Validate the private game-code path without using or uploading any
      # Nintendo game files. Game recompilation itself requires the user's NSOs.
      - name: Verify Android game library build scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/build-android-lasgame.sh
          bash -n tools/build-android-termux.sh
          python3 -m py_compile tools/gen.py
      # GitHub's Ubuntu runner already includes Android sdkmanager.
      - name: Install SDK platform, build tools, and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      # SDL3 is part of the actual LASRecomp UI/render runtime. Build for the
      # same Android ABI as the APK rather than relying on the host's SDL3.
      - name: Build SDL3 for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.2.22 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL3"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          cmake -S "$RUNNER_TEMP/SDL3" -B "$RUNNER_TEMP/sdl3-arm64" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/sdl3-arm64" --parallel 4
          SDL3_SO="$(find "$RUNNER_TEMP/sdl3-arm64" -type f -name libSDL3.so -print -quit)"
          test -s "$SDL3_SO"
          echo "SDL3_ANDROID_SO=$SDL3_SO" >> "$GITHUB_ENV"
          echo "SDL3_ANDROID_HEADERS=$RUNNER_TEMP/SDL3/include" >> "$GITHUB_ENV"
          echo "SDL3_ANDROID_JAVA_ROOT=$RUNNER_TEMP/SDL3/android-project/app/src/main/java" >> "$GITHUB_ENV"
      # Cross-compile all available real C engine modules (not synthetic
      # rendering smoke tests). FFmpeg movie, shaderc and the generated SMAA
      # HLSL include need dedicated Android dependency targets afterwards.
      - name: Compile expanded LASRecomp engine ARM64 objects
        shell: bash
        run: |
          set -euo pipefail
          CC="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          AR="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          mkdir -p build/android-runtime-objects
          mapfile -t SOURCES < <(find runtime -maxdepth 1 -name '*.c'; find runtime/hle runtime/services runtime/nvn runtime/nvn/maxwell -maxdepth 1 -name '*.c')
          SOURCES+=(runtime/platform/android.c)
          OBJECTS=()
          FAILED=()
          for src in "${SOURCES[@]}"; do
            case "$src" in
              runtime/hle/movie.c|runtime/nvn/smaa_data.c) continue ;;
            esac
            obj="build/android-runtime-objects/${src#runtime/}.o"
            mkdir -p "$(dirname "$obj")"
            if "$CC" -std=gnu11 -O2 -fPIC -fno-strict-aliasing -Wno-format -Werror=implicit-function-declaration \
              -Iruntime -Iruntime/nvn -I"$SDL3_ANDROID_HEADERS" -c "$src" -o "$obj"; then
              OBJECTS+=("$obj")
            else
              FAILED+=("$src")
              echo "::warning file=$src::Android ARM64 compiler failed for this original engine module"
            fi
          done
          if (( ${#FAILED[@]} )); then
            printf 'Failed Android C files (%d):\n' "${#FAILED[@]}"
            printf '  %s\n' "${FAILED[@]}"
            exit 1
          fi
          "$AR" rcs build/android-runtime-objects/liblasrecomp-core.a "${OBJECTS[@]}"
          echo "Compiled ${#OBJECTS[@]} actual LASRecomp engine units for Android ARM64"

      # Compile the actual NVN->Vulkan rendering code against NDK Vulkan
      # headers, upstream shaderc headers and Vulkan Memory Allocator.
      # This archives renderer object code; a complete game .so is NOT ready.
      - name: Cross-compile original Vulkan and ImGui renderer ARM64
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export SHADERC_SRC="$RUNNER_TEMP/las-shaderc"
          export VMA_SRC="$RUNNER_TEMP/las-vma"
          export VOLK_SRC="$RUNNER_TEMP/las-volk"
          git clone --depth 1 --branch 1.3.295 https://github.com/zeux/volk.git "$VOLK_SRC"
          echo "VOLK_SRC=$VOLK_SRC" >> "$GITHUB_ENV"
          git clone --depth 1 --branch v2024.4 https://github.com/google/shaderc.git "$SHADERC_SRC"
          git clone --depth 1 --branch v3.1.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git "$VMA_SRC"
          bash tools/build-android-renderer.sh
      # Compile the FFmpeg dependency used by runtime/hle/movie.c for
      # decoding the game's actual videos. No user game files are included.
      - name: Build Android FFmpeg and original movie HLE ARM64
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export FFMPEG_SRC="$RUNNER_TEMP/las-ffmpeg"
          git clone --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git "$FFMPEG_SRC"
          bash tools/build-android-ffmpeg.sh

      # The actual GLSL->SPIR-V compiler used by runtime/nvn/vulkan/shaders.c,
      # pinned to the upstream shaderc compatibility revisions.
      - name: Build real shaderc compiler Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export SHADERC_SRC="$RUNNER_TEMP/las-shaderc"
          export SHADERC_OUTPUT_DIR="$RUNNER_TEMP/las-shaderc-arm64"
          bash tools/build-android-shaderc.sh

      # First real link of the complete game runtime; the resulting .so
      # is not packaged until the link is proven successful.
      - name: Compile C++ UI and link complete LASRecomp runtime
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export SHADERC_OUTPUT_DIR="$RUNNER_TEMP/las-shaderc-arm64"
          export FFMPEG_INSTALL_DIR="$GITHUB_WORKSPACE/build/android-ffmpeg"
          export VMA_SRC="$RUNNER_TEMP/las-vma"
          bash tools/build-android-runtime.sh

      # Build the APK ONLY after its complete Android runtime has linked.
      # The final signed artifact includes all dynamic FFmpeg/Shaderc libraries.
      - name: Package and sign APK with the real game engine
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?SDK missing}}"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export ANDROID_AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          export ANDROID_ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          export ANDROID_APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          export LASRECOMP_RUNTIME_SO="$GITHUB_WORKSPACE/build/android-linked-runtime/lib/arm64-v8a/liblasrecomp_runtime.so"
          export SHADERC_SO="$RUNNER_TEMP/las-shaderc-arm64/libshaderc_shared.so"
          export FFMPEG_INSTALL_DIR="$GITHUB_WORKSPACE/build/android-ffmpeg"
          python3 -m venv "$RUNNER_TEMP/las-fonttools"
          "$RUNNER_TEMP/las-fonttools/bin/pip" install --disable-pip-version-check -q "fonttools==4.60.1"
          export FONTTOOLS_PYTHON="$RUNNER_TEMP/las-fonttools/bin/python"
          bash tools/build-android-termux.sh
          # The existing com.retroaura.lasrecomp.bootdiag install uses a
          # different CI-generated test signing key. Never tell users to
          # uninstall it (their imported Zelda data belongs to that app).
          # Build a parallel debug package from exactly the same engine.
          sed -e 's/package="com.retroaura.lasrecomp.bootdiag"/package="com.retroaura.lasrecomp.bootdiag.controls"/' \
              -e 's/LASRecomp Boot TESTE/LASRecomp Controles/g' \
              android/bootstrap/AndroidManifest.xml > "$RUNNER_TEMP/las-controls-manifest.xml"
          ANDROID_MANIFEST_OVERRIDE="$RUNNER_TEMP/las-controls-manifest.xml" \
            bash tools/build-android-termux.sh
          mv build/android-bootstrap/LASRecomp-Android.apk \
            build/android-bootstrap/LASRecomp-Android-Controles-Paralelo.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LASRecomp-Android-Controles-ARM64-Paralelo
          path: build/android-bootstrap/LASRecomp-Android-Controles-Paralelo.apk
          if-no-files-found: error
          retention-days: 14
